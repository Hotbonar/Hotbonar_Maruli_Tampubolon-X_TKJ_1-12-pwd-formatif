<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #a0b0c0;
            margin: 30px auto 30px auto;
            background-color: #ffffff;
            border-radius: 8px;
        }

        .card img {
            width: 100%;
            height: 160px;
            display: block;
            object-fit: cover;
            border-radius: 4px;
        }

        .card h3 {
            color: #1d2a44;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 15px;
            color: #555555;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .card a {
            font-size: 15px;
            color: #e68a32;
            text-decoration: none;
            font-weight: bold;
        }

        .card a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            margin-bottom: 30px;
        }

        footer a {
            color: #0056b3;
            font-size: 14px;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <main>
        <div class="card">
            <img src="../assets/images/penggarisbusur.jpg">
            <h3>Website Toko Online</h3>
            <p>Proyek latihan membuat halaman toko sederhana. Dibuat memakai HTML dan CSS.</p>
            <a href="#">Lihat Proyek</a>
        </div>
    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
